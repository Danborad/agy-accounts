name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: 语法检查
        run: python -m py_compile agy_accounts.py tests/test_agy_accounts.py
      - name: 冒烟测试
        run: python -m unittest discover -s tests -v

  webapp:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: webapp-src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npx playwright test

  powertools:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 语法检查
        run: node --check powertools/browser.js && node --check powertools/accounts.js && node --check powertools/server.mjs
      - name: 桥接安全与 RPC 测试
        run: node --test tests/test_powertools.mjs

  shellcheck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: 安装 shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: 检查脚本
        run: shellcheck -S warning install.sh uninstall.sh install-i18n.sh
