worker_processes 1;
error_log /var/log/agy-i18n-error.log warn;
pid /run/agy-i18n.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 0;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css text/plain;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen __LISTEN_PORT__;
        server_name _;

        # 外置词库与注入脚本
        location = /__agy-i18n.js {
            alias __PREFIX__/i18n/agy-i18n.js;
            default_type application/javascript;
            add_header Cache-Control "no-store";
        }
        location = /__agy-i18n-zh.json {
            alias __PREFIX__/i18n/zh-CN.json;
            default_type application/json;
            add_header Cache-Control "no-store";
        }

        location / {
            proxy_pass http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # 关闭上游压缩，才能对 HTML 做注入
            proxy_set_header Accept-Encoding "";
            sub_filter '</head>' '<script src="/__agy-i18n.js" defer></script></head>';
            sub_filter_once on;
        }
    }
}
